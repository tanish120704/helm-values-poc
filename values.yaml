# Shared tenant identity is passed to both subcharts by Helm.
global:
  tenant:
    name: "default-tenant"
    domain: "default-tenant.example.com"

# Defaults for the umbrella chart's own templates/ directory.
platform:
  supportEmail: "support@example.com"
  featureEnabled: false

# Keys match the dependency names in Chart.yaml.
# Inside each subchart, these become .Values.message and .Values.settings.*.
service-a:
  message: "Service A overridden by the parent chart"
  settings:
    environment: "poc"
    logLevel: "debug"

service-b:
  message: "Service B overridden by the parent chart"
  settings:
    environment: "poc"
    logLevel: "warn"
