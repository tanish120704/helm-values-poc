apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ printf "%s-platform" .Release.Name | trunc 63 | trimSuffix "-" }}
data:
  tenantName: {{ .Values.global.tenant.name | quote }}
  tenantDomain: {{ .Values.global.tenant.domain | quote }}
  supportEmail: {{ .Values.platform.supportEmail | quote }}
  featureEnabled: {{ .Values.platform.featureEnabled | quote }}
