apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ printf "%s-notifications" .Release.Name | trunc 63 | trimSuffix "-" }}
  labels:
    poc.example.com/role: umbrella
    poc.example.com/section: notifications
data:
  tenantName: {{ .Values.global.tenant.name | quote }}
  tenantDomain: {{ .Values.global.tenant.domain | quote }}
  config.json: |
    {{- dict "tenant" .Values.global.tenant "settings" .Values.notifications | toPrettyJson | nindent 4 }}
